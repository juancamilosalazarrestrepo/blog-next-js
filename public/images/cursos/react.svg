<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Portada del curso de React">
  <defs>
    <linearGradient id="rcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061021"/>
      <stop offset="55%" stop-color="#0d1b33"/>
      <stop offset="100%" stop-color="#0a2a3d"/>
    </linearGradient>
    <radialGradient id="rcGlow" cx="0.72" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#61dafb" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#61dafb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rcGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#rcBg)"/>
  <rect width="800" height="450" fill="url(#rcGrid)"/>
  <rect width="800" height="450" fill="url(#rcGlow)"/>
  <circle cx="120" cy="90" r="140" fill="#0072ff" fill-opacity="0.16"/>
  <g transform="translate(566 210)" stroke="#61dafb" fill="none" stroke-width="7">
    <ellipse rx="128" ry="49" stroke-opacity="0.9"/>
    <ellipse rx="128" ry="49" transform="rotate(60)" stroke-opacity="0.7"/>
    <ellipse rx="128" ry="49" transform="rotate(120)" stroke-opacity="0.5"/>
    <circle r="22" fill="#61dafb" stroke="none"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="19" fill="#ffffff" fill-opacity="0.34">
    <text x="60" y="120">function Tarjeta({ titulo }) {</text>
    <text x="86" y="154">const [visto, setVisto] = useState(0);</text>
    <text x="86" y="188">return &lt;article&gt;{titulo}&lt;/article&gt;;</text>
    <text x="60" y="222">}</text>
  </g>
  <text x="60" y="372" font-family="Inter, Segoe UI, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">React</text>
  <text x="60" y="404" font-family="Inter, Segoe UI, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#61dafb">Componentes, estado y efectos</text>
</svg>
